<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gavin Block</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #f5f5f0;
    font-family: "Inter", -apple-system, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 24px;
  }
  .name {
    font-weight: 900;
    font-size: clamp(2.5rem, 10vw, 5rem);
    letter-spacing: -0.03em;
    margin-bottom: 16px;
  }
  .status {
    font-weight: 500;
    font-size: clamp(1rem, 2.5vw, 1.3rem);
    color: #9a9a94;
    margin-bottom: 32px;
  }
  .status span { color: #5b7c99; }
  .contact {
    font-weight: 500;
    font-size: 0.95rem;
    color: #f5f5f0;
    text-decoration: none;
    border-bottom: 1px solid #5b7c99;
    padding-bottom: 3px;
  }
</style>
</head>
<body>
  <div class="name">Gavin Block</div>
  <div class="status">Site under construction <span>— check back soon</span></div>
  <a href="mailto:gavin.blockk@gmail.com" class="contact">gavin.blockk@gmail.com</a>
</body>
</html>
